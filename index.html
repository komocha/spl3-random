<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ブキルーレット</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">ブキ カタログ</span>
    <h1>スプラ3 <span>ブキルーレット</span></h1>
    <p class="lead">参加する人の名前を入れてボタンを押すと、一人ずつブキを決めます。プラベや友だちとのバトルにどうぞ。</p>
  </header>

  <section class="row" aria-label="プレイヤー">
    <div class="row-head">
      <span class="label">プレイヤー</span>
      <span class="lead" id="playerCount"></span>
    </div>
    <div class="players" id="players"></div>
    <button class="addplayer" id="addPlayer" type="button">＋ プレイヤーを追加</button>
  </section>

  <section class="stage" aria-label="結果">
    <div class="slots" id="slots" aria-live="polite"></div>
    <button class="go" id="go" type="button">ブキを決める！</button>
    <p class="note" id="note"></p>
  </section>

  <section class="settings" aria-label="設定">
    <div class="row">
      <div class="row-head">
        <span class="label">ブキ種</span>
        <span><button class="linkbtn" id="allOn" type="button">すべて選ぶ</button><button class="linkbtn" id="allOff" type="button">すべて外す</button></span>
      </div>
      <div class="chips" id="classChips"></div>
    </div>

    <div class="row">
      <span class="label">オプション</span>
      <div class="toggles">
        <label><input type="checkbox" id="noDup" checked> 同じ回でブキを被らせない</label>
        <label><input type="checkbox" id="noRepeat"> 前回と同じブキは出さない</label>
        <label><input type="checkbox" id="order" checked> レプリカ（オーダー・ヒーローなど）を含める</label>
      </div>
    </div>

    <div class="row">
      <span class="label">これまでの結果</span>
      <ol class="history" id="history"></ol>
      <p class="empty" id="historyEmpty">まだありません。</p>
    </div>
  </section>

  <details id="listBox">
    <summary>ブキ カタログ（個別に外す）<span id="poolCount"></span></summary>
    <div class="list" id="list"></div>
  </details>

  <footer>非公式のファンツールです。ブキ一覧（174種）は GameWith の「全武器一覧」をもとにしています。設定はこのブラウザに保存されます。</footer>
</div>

  "スピナー": "オーダースピナーレプリカ|スプリンクラー|ホップソナー,バレルスピナー|スプリンクラー|ホップソナー,スプラスピナー|クイックボム|ウルトラハンコ,イグザミナー|カーリングボム|エナジースタンド,バレルスピナーデコ|ポイントセンサー|テイオウイカ,イグザミナー・ヒュー|スプラッシュボム|カニタンク,ハイドラント|ロボットボム|ナイスダマ,ハイドラントカスタム|トラップ|スミナガシート,スプラスピナーコラボ|ポイズンミスト|グレートバリア,ハイドラント圧|スプリンクラー|グレートバリア,スプラスピナーPYTN|ジャンプビーコン|ウルトラショット,ノーチラス47|ポイントセンサー|アメフラシ,ノーチラス79|キューバンボム|ウルトラチャクチ,クーゲルシュライバー|タンサンボム|ジェットパック,クーゲルシュライバー・ヒュー|トラップ|キューインキ",

  "シェルター": "オーダーシェルターレプリカ|スプリンクラー|トリプルトルネード,パラシェルター|スプリンクラー|トリプルトルネード,24式張替傘・甲|ラインマーカー|グレートバリア,キャンピングシェルター|ジャンプビーコン|キューインキ,スパイガジェット|トラップ|サメライド,パラシェルターソレーラ|ロボットボム|ジェットパック,24式張替傘・乙|ポイズンミスト|ウルトラチャクチ,キャンピングシェルターソレーラ|トラップ|ウルトラショット,スパイガジェットソレーラ|トーピード|スミナガシート,キャンピングシェルターCREM|ポイズンミスト|デコイチラシ,スパイガジェット繚|カーリングボム|メガホンレーザー5.1ch",
  "ストリンガー": "オーダーストリンガーレプリカ|ポイズンミスト|メガホンレーザー5.1ch,トライストリンガー|ポイズンミスト|メガホンレーザー5.1ch,LACT-450|カーリングボム|マルチミサイル,トライストリンガーコラボ|スプリンクラー|デコイチラシ,LACT-450デコ|スプラッシュシールド|サメライド,トライストリンガー燈|ラインマーカー|ジェットパック,LACT-450MILK|トーピード|ナイスダマ,フルイドV|ロボットボム|ウルトラハンコ,フルイドVカスタム|ポイントセンサー|ホップソナー",
  "ワイパー": "オーダーワイパーレプリカ|クイックボム|ショクワンダー,ドライブワイパー|トーピード|ウルトラハンコ,ドライブワイパーデコ|ジャンプビーコン|マルチミサイル,ドライブワイパーRUST|カーリングボム|ウルトラショット,ジムワイパー|クイックボム|ショクワンダー,ジムワイパー・ヒュー|ポイズンミスト|カニタンク,デンタルワイパーミント|キューバンボム|グレートバリア,ジムワイパー封|ロボットボム|ナイスダマ,デンタルワイパースミ|スプラッシュシールド|ジェットパック"
};
const CLASSES = Object.keys(DATA);
const WEAPONS = CLASSES.flatMap(c => DATA[c].split(",").map(item => {
  const [name, sub, sp] = item.split("|");
  return { name, sub, sp, cls: c, replica: name.endsWith("レプリカ") };
}));
const kitText = w => `サブ ${w.sub} ／ SP ${w.sp}`;
const MAX_PLAYERS = 8;
const STORE_KEY = "buki-roulette-v1";

const state = { classes: new Set(CLASSES), excluded: new Set(), names: [""], noDup: true, noRepeat: false, order: true, last: [], history: [] };
const playerLabel = i => state.names[i].trim() || `${i + 1}P`;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!s) return;
    state.classes = new Set((s.classes || CLASSES).filter(c => CLASSES.includes(c)));
    state.excluded = new Set(s.excluded || []);
    if (Array.isArray(s.names) && s.names.length) state.names = s.names.slice(0, MAX_PLAYERS).map(String);
    ["noDup", "noRepeat", "order"].forEach(k => { if (typeof s[k] === "boolean") state[k] = s[k]; });
    state.history = Array.isArray(s.history) ? s.history.slice(0, 10) : [];
    state.last = Array.isArray(s.last) ? s.last : [];
  } catch (e) { /* storage unavailable: keep defaults */ }
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      classes: [...state.classes], excluded: [...state.excluded], names: state.names,
      noDup: state.noDup, noRepeat: state.noRepeat, order: state.order, history: state.history, last: state.last
    }));
  } catch (e) { /* storage unavailable: settings last for this visit only */ }
}

function pool() {
  return WEAPONS.filter(w => state.classes.has(w.cls) && !state.excluded.has(w.name) && (state.order || !w.replica));
}
const $ = id => document.getElementById(id);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function draw() {
  let candidates = pool();
  if (state.noRepeat && state.last.length) {
    const filtered = candidates.filter(w => !state.last.includes(w.name));
    if (filtered.length) candidates = filtered;
  }
  const out = [];
  for (let i = 0; i < state.names.length; i++) {
    let choices = candidates;
    if (state.noDup) {
      choices = candidates.filter(w => !out.includes(w));
      if (!choices.length) choices = candidates; // fewer weapons than players: allow repeats
    }
    out.push(pick(choices));
  }
  return out;
}

function renderSlots(results) {
  const box = $("slots");
  box.innerHTML = "";
  const solo = state.names.length === 1;
  for (let i = 0; i < state.names.length; i++) {
    const w = results ? results[i] : null;
    const el = document.createElement("div");
    el.className = "slot" + (solo ? " solo" : "");
    el.innerHTML = `<span class="who"></span><span class="cls"></span><span class="name"></span>` +
      `<div class="kit"><div class="kit-item"><span class="kit-label">サブウェポン</span><span class="kit-value kit-sub"></span></div>` +
      `<div class="kit-item"><span class="kit-label">スペシャルウェポン</span><span class="kit-value kit-sp"></span></div></div>`;
    el.querySelector(".name").textContent = w ? w.name : "？？？";
    showDetails(el, w);
    box.appendChild(el);
  }
  updateWho();
}
// Refresh the player names on the result cards without redrawing the weapons.
function updateWho() {
  const solo = state.names.length === 1;
  document.querySelectorAll(".slot .who").forEach((el, i) => {
    el.textContent = playerLabel(i);
    el.hidden = solo && !state.names[0].trim();
  });
}

function renderPlayers() {
  const box = $("players");
  box.innerHTML = "";
  state.names.forEach((name, i) => {
    const row = document.createElement("div");
    row.className = "player";
    const num = document.createElement("span"); num.className = "num"; num.textContent = `${i + 1}P`;
    const input = document.createElement("input");
    input.type = "text"; input.id = "player-" + i; input.maxLength = 20;
    input.placeholder = "名前"; input.value = name; input.autocomplete = "off";
    input.setAttribute("aria-label", `${i + 1}人目の名前`);
    input.addEventListener("input", () => { state.names[i] = input.value; save(); updateWho(); });
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); i === state.names.length - 1 ? addPlayer() : $("player-" + (i + 1)).focus(); }
    });
    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "remove"; rm.textContent = "×";
    rm.setAttribute("aria-label", `${playerLabel(i)}を外す`);
    rm.disabled = state.names.length <= 1;
    rm.addEventListener("click", () => { state.names.splice(i, 1); renderPlayers(); changed(); });
    row.append(num, input, rm);
    box.appendChild(row);
  });
  $("addPlayer").disabled = state.names.length >= MAX_PLAYERS;
  $("playerCount").textContent = `${state.names.length}人（最大${MAX_PLAYERS}人）`;
}
function addPlayer() {
  if (state.names.length >= MAX_PLAYERS) return;
  state.names.push("");
  renderPlayers();
  changed();
  $("player-" + (state.names.length - 1)).focus();
}
function showDetails(el, w) {
  const cls = el.querySelector(".cls"), sub = el.querySelector(".kit-sub"), sp = el.querySelector(".kit-sp");
  cls.hidden = !w;
  cls.textContent = w ? w.cls : "";
  sub.textContent = w ? w.sub : "？？？";
  sp.textContent = w ? w.sp : "？？？";
}

let spinning = false;
function spin() {
  const p = pool();
  if (!p.length || spinning) return;
  spinning = true;
  $("go").disabled = true;
  const results = draw();
  renderSlots(results);
  const slots = [...document.querySelectorAll(".slot")];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const finish = (el, w) => {
    el.classList.remove("spinning");
    el.classList.add("landed");
    el.querySelector(".name").textContent = w.name;
    showDetails(el, w);
  };
  if (reduce) {
    slots.forEach((el, i) => finish(el, results[i]));
    done(results);
    return;
  }
  slots.forEach(el => { el.classList.add("spinning"); showDetails(el, null); });
  const start = performance.now();
  let lastTick = 0;
  function frame(now) {
    const t = now - start;
    if (now - lastTick > 60) {
      lastTick = now;
      slots.forEach((el, i) => {
        if (el.classList.contains("spinning")) el.querySelector(".name").textContent = pick(p).name;
      });
    }
    slots.forEach((el, i) => {
      if (el.classList.contains("spinning") && t > 900 + i * 180) finish(el, results[i]);
    });
    if (slots.some(el => el.classList.contains("spinning"))) requestAnimationFrame(frame);
    else done(results);
  }
  requestAnimationFrame(frame);
}
function done(results) {
  spinning = false;
  state.last = results.map(w => w.name);
  const time = new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  state.history.unshift({ time, names: state.last, players: state.names.map((_, i) => playerLabel(i)) });
  state.history = state.history.slice(0, 10);
  save();
  renderHistory();
  updateGo();
}

function renderHistory() {
  const ol = $("history");
  ol.innerHTML = "";
  state.history.forEach(h => {
    const li = document.createElement("li");
    const t = document.createElement("span"); t.textContent = h.time;
    const n = document.createElement("span");
    const who = h.players || h.names.map((_, i) => `${i + 1}P`);
    n.textContent = h.names.map((x, i) => `${who[i]}：${x}`).join(" ／ ");
    li.append(t, n);
    ol.appendChild(li);
  });
  $("historyEmpty").hidden = state.history.length > 0;
}

function renderChips() {
  const box = $("classChips");
  box.innerHTML = "";
  CLASSES.forEach((c, i) => {
    const id = "cls-" + i;
    const n = WEAPONS.filter(w => w.cls === c).length;
    const wrap = document.createElement("span");
    wrap.innerHTML = `<input type="checkbox" id="${id}"><label class="chip" for="${id}">${c}<small>${n}</small></label>`;
    const input = wrap.querySelector("input");
    input.checked = state.classes.has(c);
    input.addEventListener("change", () => {
      input.checked ? state.classes.add(c) : state.classes.delete(c);
      changed();
    });
    box.appendChild(wrap);
  });
}

function renderList() {
  const box = $("list");
  box.innerHTML = "";
  let k = 0;
  CLASSES.forEach(c => {
    const g = document.createElement("div");
    g.className = "group";
    const h = document.createElement("h2"); h.textContent = c;
    const grid = document.createElement("div"); grid.className = "weapons";
    WEAPONS.filter(w => w.cls === c).forEach(w => {
      const id = "w-" + (k++);
      const label = document.createElement("label");
      label.htmlFor = id;
      const input = document.createElement("input");
      input.type = "checkbox"; input.id = id; input.checked = !state.excluded.has(w.name);
      const span = document.createElement("span"); span.textContent = w.name;
      const small = document.createElement("small"); small.textContent = kitText(w);
      span.appendChild(small);
      label.classList.toggle("out", !input.checked);
      input.addEventListener("change", () => {
        input.checked ? state.excluded.delete(w.name) : state.excluded.add(w.name);
        label.classList.toggle("out", !input.checked);
        changed(false);
      });
      label.append(input, span);
      grid.appendChild(label);
    });
    g.append(h, grid);
    box.appendChild(g);
  });
}

function updateGo() {
  const n = pool().length;
  $("poolCount").textContent = `　抽選対象 ${n} / ${WEAPONS.length}`;
  $("go").disabled = spinning || n === 0;
  let msg = `${n}種類のブキから選びます`;
  if (n === 0) msg = "抽選できるブキがありません。ブキ種を1つ以上選んでください。";
  else if (state.noDup && n < state.names.length) msg = `ブキが${state.names.length}種類より少ないため、一部が被ります`;
  $("note").textContent = msg;
}

function changed(rerenderSlots = true) {
  save();
  if (rerenderSlots && !spinning) renderSlots(null);
  updateGo();
}

function init() {
  load();
  renderChips();
  renderList();
  renderHistory();
  ["noDup", "noRepeat", "order"].forEach(k => {
    const el = $(k);
    el.checked = state[k];
    el.addEventListener("change", () => { state[k] = el.checked; changed(false); });
  });
  renderPlayers();
  $("addPlayer").addEventListener("click", addPlayer);
  $("allOn").addEventListener("click", () => { state.classes = new Set(CLASSES); renderChips(); changed(false); });
  $("allOff").addEventListener("click", () => { state.classes = new Set(); renderChips(); changed(false); });
  $("go").addEventListener("click", spin);
  changed();
  // Open on a real result so the first view shows what the tool does.
  const sample = draw();
  if (sample.length && sample[0]) {
    renderSlots(sample);
    document.querySelectorAll(".slot").forEach(el => el.classList.add("landed"));
  }
}
init();
</script>
</body>
</html>
